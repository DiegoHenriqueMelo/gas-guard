[platformio]
; O toolchain xtensa nao consegue ESCREVER em caminhos com caracteres
; nao-ASCII (o "3o ano" do caminho deste repo). A compilacao passa, mas o
; linker falha ao gerar o firmware.map. Mandar a saida do build para um
; caminho 100% ASCII resolve, e funciona de qualquer pasta que voce abrir.
build_dir = C:/pio-build/gasguard

; ---------------------------------------------------------------------------
; pioarduino: fork mantido pela comunidade.
;
; E necessario porque o platform-espressif32 OFICIAL do PlatformIO ainda
; entrega o arduino-esp32 2.x, e o sketch usa ledcAttachChannel() /
; ledcWriteTone(pino, freq), que so existem no core 3.x. Com o oficial,
; o build falha com "ledcAttachChannel was not declared in this scope".
;
; A versao esta fixada de proposito: build reproduzivel no dia da avaliacao.
; Para acompanhar a ultima, troque a tag por "stable".
; ---------------------------------------------------------------------------

[env:esp32dev]
platform = https://github.com/pioarduino/platform-espressif32/releases/download/55.03.311/platform-espressif32.zip
board = esp32dev
framework = arduino

; mesma velocidade do Serial.begin() no sketch
monitor_speed = 115200

lib_deps =
    knolleary/PubSubClient@^2.8
