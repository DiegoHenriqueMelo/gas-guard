server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # O vue-router usa history mode: as rotas nao existem como arquivo no
    # disco. Sem este try_files, dar F5 em qualquer rota que nao seja "/"
    # devolve o 404 do proprio nginx, porque ele procura um arquivo com
    # aquele nome. Aqui, qualquer caminho desconhecido cai no index.html e
    # quem resolve a rota e o JavaScript.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os bundles do Vite tem hash no nome, entao podem ser cacheados para
    # sempre: uma versao nova gera um nome novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
