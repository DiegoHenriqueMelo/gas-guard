# nginx-unprivileged: roda como usuario comum, por isso escuta na 8080
# (portas abaixo de 1024 exigem root).
server {
    listen 8080;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # DNS interno do Docker. Com o endereco numa variavel, o nginx resolve
    # "api" a cada 10 s em vez de uma vez so na subida - se o container da
    # API for recriado (IP novo), o proxy continua funcionando.
    resolver 127.0.0.11 valid=10s ipv6=off;
    set $api http://api:8000;

    # A API nao tem porta publicada: o navegador fala so com este nginx, na
    # mesma origem do Vue (sem CORS, e o JWT nunca sai para outro host).
    location /api/ {
        proxy_pass $api;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        # a resposta do assistente chega em pedacos (streaming): nao
        # segurar no buffer do nginx ate o fim
        proxy_buffering off;
        client_max_body_size 1m;
    }

    # WebSocket: o "upgrade" de HTTP para WS precisa destes cabecalhos.
    location /ws {
        proxy_pass $api;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 3600s;
    }

    # O vue-router usa history mode: as rotas nao existem como arquivo no
    # disco. Sem este try_files, dar F5 em qualquer rota que nao seja "/"
    # devolve o 404 do proprio nginx.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Os bundles do Vite tem hash no nome, entao podem ser cacheados para
    # sempre: uma versao nova gera um nome novo.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }
}
