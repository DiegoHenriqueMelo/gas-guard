listener 1883

# Sem acesso anonimo: todo cliente se identifica. As senhas vem do .env e
# viram /mosquitto/auth/passwd (com hash) no entrypoint.sh, a cada subida.
allow_anonymous false
password_file /mosquitto/auth/passwd

# Permissao por topico: cada usuario so le e escreve onde precisa (ver acl).
acl_file /mosquitto/auth/acl

persistence true
persistence_location /mosquitto/data/

log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
