# Carregado depois do 10-defaults.conf da imagem (vai em conf.d/20-*).

# Usuarios, vhost, exchanges, filas e ligacoes vem deste arquivo, gerado
# por scripts/gerar_segredos.py (nao versionado: tem os hashes das senhas).
definitions.import_backend = local_filesystem
definitions.local.path = /etc/rabbitmq/definitions.json

# Estatisticas da interface a cada 2 s (o padrao e 5 s): a pagina
# Mensageria fica mais "ao vivo".
collect_statistics_interval = 2000

# Um job do laboratorio pode levar varios minutos ate o ack. O padrao
# (30 min) ja sobra, mas deixamos explicito: 1 hora.
consumer_timeout = 3600000
